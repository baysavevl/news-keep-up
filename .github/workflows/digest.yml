name: News Keep Up Digest

on:
  # Manual fallback only. The long-lived scheduler service owns periodic ticks.
  workflow_dispatch:

concurrency:
  group: news-keep-up-scheduler-tick
  cancel-in-progress: false

jobs:
  scheduler-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Vercel scheduler tick
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent --max-time 290 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://news-keep-up.vercel.app/api/scheduler/tick"
          echo
